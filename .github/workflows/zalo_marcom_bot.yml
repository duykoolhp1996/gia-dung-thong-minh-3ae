name: 🤖 Marcom 3AE - Zalo Bot & Báo Cáo Tự Động (24/7 Cloud)

on:
  # 1. Tự động chạy đúng 08:30 Sáng (Giờ Việt Nam UTC+7 = 01:30 UTC) từ Thứ 2 đến Thứ 7
  schedule:
    - cron: '30 1 * * 1-6'

  # 2. Cho phép bấm nút chạy bất cứ lúc nào trên Điện thoại / Web GitHub
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Chọn loại báo cáo muốn bắn vào Zalo'
        required: true
        default: 'daily_all'
        type: choice
        options:
          - daily_all
          - daily_mobile
          - weekly_all
          - weekly_mobile
          - personal_only
          - sync_only
      target_chat:
        description: 'Nơi nhận báo cáo (Mặc định: Nhóm Zalo 3AE)'
        required: true
        default: 'zgr-323efe35775a9e04c74b'
        type: choice
        options:
          - zgr-323efe35775a9e04c74b
          - fe4d0d0d2659cf079648
      target_person:
        description: 'Tên nhân sự (Nếu chỉ muốn gửi riêng 1 người: Loan, Mỵ, Toàn, Phụng)'
        required: false
        default: ''
        type: string

  # 3. Cho phép Google Apps Script (Chatbot 24/7) gọi sang để render ảnh Infographic
  repository_dispatch:
    types: [zalo_bot_command]

permissions:
  contents: write

jobs:
  send_zalo_reports:
    name: 🚀 Đồng bộ Sheets & Bắn Báo Cáo Infographic Zalo
    runs-on: windows-latest

    steps:
      - name: 📥 Tải mã nguồn dự án 3AE
        uses: actions/checkout@v4

      - name: 🕒 Chuyển múi giờ máy chủ sang Giờ Việt Nam (UTC+7)
        shell: pwsh
        run: |
          tzutil /s "SE Asia Standard Time"
          Write-Host "Giờ hệ thống hiện tại (VN): $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss')" -ForegroundColor Green

      - name: 🔄 Đồng bộ dữ liệu trực tiếp từ Google Sheets
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\sync_sheets_to_app.ps1

      - name: 🎨 Render Infographic & Bắn vào Nhóm Zalo
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ github.event.inputs.report_type }}
          INPUT_CHAT: ${{ github.event.inputs.target_chat }}
          INPUT_PERSON: ${{ github.event.inputs.target_person }}
          DISPATCH_TYPE: ${{ github.event.client_payload.report_type }}
          DISPATCH_CHAT: ${{ github.event.client_payload.chat_id }}
          DISPATCH_PERSON: ${{ github.event.client_payload.person }}
        run: |
          $chatId = "zgr-323efe35775a9e04c74b"
          if (-not [string]::IsNullOrWhiteSpace($env:DISPATCH_CHAT)) {
              $chatId = $env:DISPATCH_CHAT
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_CHAT)) {
              $chatId = $env:INPUT_CHAT
          }

          $reportType = "daily_all"
          if ($env:EVENT_NAME -eq "schedule") {
              $now = Get-Date
              if ($now.DayOfWeek -eq [DayOfWeek]::Monday) {
                  $reportType = "monday_full"
              } else {
                  $reportType = "daily_all"
              }
          } elseif (-not [string]::IsNullOrWhiteSpace($env:DISPATCH_TYPE)) {
              $reportType = $env:DISPATCH_TYPE
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TYPE)) {
              $reportType = $env:INPUT_TYPE
          }

          $person = if (-not [string]::IsNullOrWhiteSpace($env:DISPATCH_PERSON)) { $env:DISPATCH_PERSON } else { $env:INPUT_PERSON }

          Write-Host "==========================================================" -ForegroundColor Cyan
          Write-Host "🚀 ĐANG CHẠY BÁO CÁO CLOUD: $reportType -> ChatID: $chatId" -ForegroundColor Yellow
          Write-Host "==========================================================" -ForegroundColor Cyan

          switch ($reportType) {
              "monday_full" {
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_weekly_report_img.ps1 -ChatId $chatId -Layout "16:9"
                  Start-Sleep -Seconds 2
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_daily_tasks_img.ps1 -ChatId $chatId -Layout "16:9"
                  Start-Sleep -Seconds 2
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_personal_reports_img.ps1 -ChatId $chatId
              }
              "daily_all" {
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_daily_tasks_img.ps1 -ChatId $chatId -Layout "16:9"
                  Start-Sleep -Seconds 2
                  if (-not [string]::IsNullOrWhiteSpace($person)) {
                      powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_personal_reports_img.ps1 -ChatId $chatId -TargetPerson $person
                  } else {
                      powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_personal_reports_img.ps1 -ChatId $chatId
                  }
              }
              "daily_mobile" {
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_daily_tasks_img.ps1 -ChatId $chatId -Layout "mobile"
                  Start-Sleep -Seconds 2
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_personal_reports_img.ps1 -ChatId $chatId
              }
              "weekly_all" {
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_weekly_report_img.ps1 -ChatId $chatId -Layout "16:9"
                  Start-Sleep -Seconds 2
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_personal_reports_img.ps1 -ChatId $chatId
              }
              "weekly_mobile" {
                  powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_weekly_report_img.ps1 -ChatId $chatId -Layout "mobile"
              }
              "personal_only" {
                  if (-not [string]::IsNullOrWhiteSpace($person)) {
                      powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_personal_reports_img.ps1 -ChatId $chatId -TargetPerson $person
                  } else {
                      powershell -NoProfile -ExecutionPolicy Bypass -File .\generate_personal_reports_img.ps1 -ChatId $chatId
                  }
              }
              "sync_only" {
                  Write-Host "Chỉ thực hiện đồng bộ dữ liệu Google Sheets." -ForegroundColor Green
              }
          }

      - name: 💾 Tự động cập nhật dữ liệu mới nhất lên Web Dashboard (GitHub Pages)
        shell: pwsh
        run: |
          git config user.name "Marcom 3AE Bot"
          git config user.email "bot@giadungthongminh3ae.vn"
          git add database.json lark_tables_data.js marcom_rust/static/database.json marcom_rust/static/lark_tables_data.js
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore(sync): auto-update marketing data from Google Sheets [skip ci]"
              git push
              Write-Host "✅ Đã cập nhật dữ liệu mới nhất lên GitHub Pages!" -ForegroundColor Green
          } else {
              Write-Host "ℹ️ Dữ liệu không có thay đổi mới." -ForegroundColor Gray
          }
