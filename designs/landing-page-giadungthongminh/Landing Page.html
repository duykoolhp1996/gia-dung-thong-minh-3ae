<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Dụng Thông Minh 3AE — Nhẹ Gánh Việc Nhà, Nhờ Nhà Thông Minh</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- React 18 & Babel CDN with integrity -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --brand-primary: #FCD10C;
      --brand-primary-hover: #E5BC0B;
      --brand-primary-soft: #FEF9C3;
      --brand-dark: #000000;
      --brand-dark-card: #121826;
      --surface: #F8FAFC;
      --surface-raised: #FFFFFF;
      --surface-subtle: #F1F5F9;
      --line: #E2E8F0;
      --line-strong: #CBD5E1;
      --ink: #0F172A;
      --ink-muted: #64748B;
      --verified-green: #10B981;
      --verified-green-soft: #D1FAE5;
      --promo-red: #EF4444;
      --promo-red-soft: #FEE2E2;
      --tech-blue: #0284C7;
      --tech-blue-soft: #E0F2FE;
      --radius-pill: 9999px;
      --radius-card: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.12), 0 4px 8px -2px rgba(15, 23, 42, 0.04);
      --shadow-xl: 0 20px 30px -8px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--surface);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, .font-heading {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    /* Top Announcement Bar */
    .gdtm-topbar {
      background-color: var(--brand-primary);
      color: #000;
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.2px;
    }
    .gdtm-topbar-chip {
      background: #000;
      color: #fff;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      margin-right: 8px;
    }
    .gdtm-topbar-right {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 12px;
    }

    /* Main Navbar */
    .gdtm-navbar {
      background-color: var(--brand-dark);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gdtm-navbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .search-bar {
      flex: 1;
      max-width: 500px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: #fff;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      padding: 10px 44px 10px 20px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(252, 209, 12, 0.35);
    }
    .search-icon-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      background: transparent;
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .cart-btn {
      background: var(--brand-primary);
      color: #000;
      font-weight: 800;
      border-radius: var(--radius-pill);
      padding: 8px 18px;
    }
    .cart-btn:hover {
      background: var(--brand-primary-hover);
      transform: translateY(-1px);
    }

    /* Hero Section */
    .hero-section {
      background: linear-gradient(145deg, #090D16 0%, #000000 60%, #171E2E 100%);
      color: #fff;
      padding: 70px 24px;
      position: relative;
      overflow: hidden;
    }
    .hero-section::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(252, 209, 12, 0.18) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }
    .hero-container {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 40px;
      position: relative;
      z-index: 2;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(252, 209, 12, 0.15);
      border: 1px solid var(--brand-primary);
      color: var(--brand-primary);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .hero-title {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 18px;
      letter-spacing: -0.02em;
    }
    .hero-title span {
      color: var(--brand-primary);
      background: linear-gradient(90deg, #FCD10C 0%, #FFE266 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-desc {
      font-size: 17px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 560px;
    }
    .hero-cta-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .btn-primary {
      background: var(--brand-primary);
      color: #000;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(252, 209, 12, 0.3);
      text-decoration: none;
    }
    .btn-primary:hover {
      background: var(--brand-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(252, 209, 12, 0.4);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: #fff;
    }
    .hero-trust-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 24px;
    }
    .trust-item-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .trust-item-sub {
      font-size: 12px;
      color: #94A3B8;
    }

    /* Hero Interactive Device Card */
    .hero-preview-box {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(252, 209, 12, 0.3);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .device-screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 18px;
    }

    /* Container Standard */
    .site-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    /* Section Headers */
    .section-title-wrap {
      text-align: center;
      margin-bottom: 40px;
    }
    .section-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: var(--brand-primary-soft);
      color: #854D0E;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .section-main-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .section-subtitle {
      font-size: 16px;
      color: var(--ink-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Interactive Smarthome Simulator Widget */
    .simulator-container {
      background: linear-gradient(135deg, #090D16 0%, #111827 100%);
      color: #fff;
      border-radius: var(--radius-card);
      padding: 36px;
      border: 1px solid rgba(252, 209, 12, 0.25);
      box-shadow: var(--shadow-xl);
      margin-bottom: 60px;
    }
    .simulator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
    }
    .room-canvas {
      height: 320px;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      transition: all 0.5s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .room-status-badge {
      align-self: flex-start;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sim-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .control-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .control-card.active {
      background: rgba(252, 209, 12, 0.15);
      border-color: var(--brand-primary);
      box-shadow: 0 0 15px rgba(252, 209, 12, 0.2);
    }
    .control-card:hover {
      transform: translateY(-2px);
    }

    /* Product Cards & Filter Tabs */
    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .filter-tab-btn {
      background: var(--surface-raised);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tab-btn.active {
      background: var(--brand-dark);
      color: var(--brand-primary);
      border-color: var(--brand-dark);
      box-shadow: var(--shadow-sm);
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .product-card {
      background: var(--surface-raised);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--line-strong);
    }
    .card-img-wrap {
      background: #F8FAFC;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      border-bottom: 1px solid var(--line);
    }
    .card-badge-verified {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--verified-green-soft);
      color: #065F46;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .card-badge-discount {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--promo-red);
      color: #fff;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-brand {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--tech-blue);
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
      line-height: 1.35;
      min-height: 44px;
    }
    .card-specs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .spec-tag {
      font-size: 11px;
      background: var(--surface-subtle);
      color: var(--ink-muted);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .card-pricing {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 16px;
    }
    .price-current {
      font-size: 20px;
      font-weight: 900;
      color: var(--promo-red);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .price-old {
      font-size: 12.5px;
      color: var(--ink-muted);
      text-decoration: line-through;
    }
    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-quick-view {
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quick-view:hover {
      background: #E2E8F0;
    }
    .btn-add-cart {
      background: var(--brand-primary);
      border: none;
      color: #000;
      font-size: 12.5px;
      font-weight: 800;
      padding: 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-add-cart:hover {
      background: var(--brand-primary-hover);
    }

    /* Estimator Tool */
    .estimator-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      padding: 36px;
      box-shadow: var(--shadow-md);
      margin-top: 40px;
    }
    .estimator-options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin: 18px 0 28px 0;
    }
    .choice-card {
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .choice-card.selected {
      border-color: var(--brand-primary);
      background: var(--brand-primary-soft);
      font-weight: 700;
    }

    /* Cart Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      justify-content: flex-end;
      animation: fadeIn 0.2s ease;
    }
    .drawer-panel {
      width: 100%;
      max-width: 440px;
      background: #fff;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0,0,0,0.25);
      animation: slideLeft 0.3s ease;
    }
    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .drawer-footer {
      padding: 20px;
      border-top: 1px solid var(--line);
      background: var(--surface-subtle);
    }

    /* Modal Quick View */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      z-index: 2100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-box {
      background: #fff;
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
      box-shadow: var(--shadow-xl);
      animation: scaleUp 0.25s ease;
    }

    /* Toast Notification */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--brand-dark);
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-pill);
      border-left: 4px solid var(--brand-primary);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 3000;
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Footer */
    .site-footer {
      background: var(--brand-dark);
      color: #94A3B8;
      padding: 60px 24px 30px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .footer-grid {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.5fr repeat(3, 1fr);
      gap: 40px;
      margin-bottom: 40px;
    }
    .footer-heading {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .footer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13.5px;
    }
    .footer-links a {
      color: #94A3B8;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover {
      color: var(--brand-primary);
    }
    .footer-bottom {
      max-width: 1240px;
      margin: 0 auto;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes toastIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    @media (max-width: 900px) {
      .hero-container { grid-template-columns: 1fr; }
      .simulator-grid { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // DATA DEFINITION: CATALOG SẢN PHẨM CHUẨN GIA DỤNG THÔNG MINH 3AE
    const INITIAL_PRODUCTS = [
