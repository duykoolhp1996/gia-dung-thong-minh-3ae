<!-- @dsCard group="Brand" viewport="700x150" subtitle="Chuẩn liên kết logo cùng các nhãn hàng đối tác" name="Co-Branding Đối Tác" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-display); background:var(--surface-raised); padding:16px 20px; box-sizing:border-box; color:var(--ink); }
  .partner-box { border:1px dashed var(--line-strong); background:var(--surface-subtle); border-radius:var(--radius-md); padding:16px; display:flex; align-items:center; justify-content:space-around; }
  .brand-name { font-size:14px; font-weight:900; letter-spacing:-0.02em; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .divider { height:28px; width:1px; background:var(--line-strong); }
  .partner-logo { font-size:14px; font-weight:800; letter-spacing:1px; }
  .hunonic { color:#0284C7; }
  .gaabor { color:#EA580C; }
  .masuto { color:#059669; }
  .caption { font-size:10.5px; color:var(--ink-muted); font-family:var(--font-body); text-align:center; margin-top:8px; }
</style>
</head>
<body>
<div class="partner-box">
  <div class="brand-name">
    <span style="color:#E5BC0B;">★</span> GIA DỤNG THÔNG MINH
  </div>
  <div class="divider"></div>
  <div class="partner-logo hunonic">HUNONIC</div>
  <div class="divider"></div>
  <div class="partner-logo gaabor">GAABOR</div>
  <div class="divider"></div>
  <div class="partner-logo masuto">MASUTO</div>
</div>
<div class="caption">
  *Quy chuẩn hiển thị: Phân cách bằng gạch dọc 60% chiều cao, diện tích thị giác 1:1, bảo chứng phân phối chính hãng.*
</div>
</body>
</html>
