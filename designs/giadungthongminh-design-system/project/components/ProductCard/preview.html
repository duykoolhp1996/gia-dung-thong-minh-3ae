<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Product Card — preview</title>
<link rel="stylesheet" href="../bundle.css">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans", system-ui, sans-serif; background:#F8FAFC; padding:24px; display:flex; gap:20px; }
</style>
</head>
<body>
<!-- Product 1 -->
<div class="gdtm-card">
  <div class="gdtm-card-image-wrap">
    <div class="gdtm-card-badge-top">
      <span class="gdtm-badge gdtm-badge-danger">-30%</span>
      <span class="gdtm-badge gdtm-badge-brand">Bán chạy</span>
    </div>
    <button class="gdtm-card-fav-btn" type="button" aria-label="Yêu thích">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
    <div class="gdtm-card-mock-img">
      <!-- Icon illustration of smart robot vacuum -->
      <svg width="84" height="84" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
        <circle cx="32" cy="32" r="20" fill="#FFFFFF" stroke="#FCD10C" stroke-width="3"/>
        <circle cx="32" cy="22" r="6" fill="#000000"/>
        <path d="M20 40H44" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
        <circle cx="32" cy="22" r="2" fill="#FCD10C"/>
      </svg>
    </div>
  </div>

  <div class="gdtm-card-body">
    <div class="gdtm-card-tagline">
      <span class="gdtm-badge gdtm-badge-success">Chính hãng</span>
      <span class="gdtm-badge gdtm-badge-info">Xuất VAT</span>
    </div>
    <h3 class="gdtm-card-title">Robot Hút Bụi Lau Nhà Ecovacs Deebot T20 Omni</h3>
    <div class="gdtm-card-rating">
      <span class="gdtm-stars">★★★★★</span>
      <span class="gdtm-rating-count">(142)</span>
    </div>
    <div class="gdtm-card-price-row">
      <span class="gdtm-price-current">8.490.000₫</span>
      <span class="gdtm-price-old">12.190.000₫</span>
    </div>
    <button class="gdtm-btn gdtm-btn-primary gdtm-btn-block">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Thêm vào giỏ
    </button>
  </div>
</div>
</body>
</html>
